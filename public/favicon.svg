<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#shine)"/>

  <!-- Left document -->
  <rect x="9" y="14" width="20" height="26" rx="3" fill="white" fill-opacity="0.25"/>
  <!-- dog-ear -->
  <path d="M23 14 L29 20 H23 V14Z" fill="white" fill-opacity="0.4"/>
  <!-- doc lines -->
  <rect x="12" y="24" width="11" height="2" rx="1" fill="white" fill-opacity="0.7"/>
  <rect x="12" y="28.5" width="8" height="2" rx="1" fill="white" fill-opacity="0.5"/>
  <rect x="12" y="33" width="10" height="2" rx="1" fill="white" fill-opacity="0.5"/>

  <!-- Right document -->
  <rect x="35" y="24" width="20" height="26" rx="3" fill="white" fill-opacity="0.25"/>
  <!-- dog-ear -->
  <path d="M49 24 L55 30 H49 V24Z" fill="white" fill-opacity="0.4"/>
  <!-- doc lines -->
  <rect x="38" y="34" width="11" height="2" rx="1" fill="white" fill-opacity="0.7"/>
  <rect x="38" y="38.5" width="8" height="2" rx="1" fill="white" fill-opacity="0.5"/>
  <rect x="38" y="43" width="10" height="2" rx="1" fill="white" fill-opacity="0.5"/>

  <!-- Center conversion arrows -->
  <!-- Arrow right -->
  <path d="M28 29 L36 29" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M33 26 L36.5 29 L33 32" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Arrow left -->
  <path d="M28 36 L36 36" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M31 33 L27.5 36 L31 39" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>